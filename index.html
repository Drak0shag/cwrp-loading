<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MAGIC REPUBLIC</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F0F12; }
	body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #E8E8EC; }

	.slide {
		position: absolute; left: 0; top: 0; width: 100%; height: 100%;
		background-position: center; background-size: cover; background-repeat: no-repeat;
		opacity: 0;
		-webkit-transition: opacity 1.6s ease; transition: opacity 1.6s ease;
		-webkit-transform: scale(1.0); transform: scale(1.0);
	}
	.slide.on {
		opacity: 1;
		-webkit-animation: drift 9s linear forwards; animation: drift 9s linear forwards;
	}
	@-webkit-keyframes drift { from { -webkit-transform: scale(1.0); } to { -webkit-transform: scale(1.06); } }
	@keyframes drift { from { transform: scale(1.0); } to { transform: scale(1.06); } }

	#shade {
		position: absolute; left: 0; right: 0; bottom: 0; height: 17%; min-height: 120px;
		background: -webkit-linear-gradient(top, rgba(15,15,18,0) 0%, rgba(15,15,18,0.88) 55%, rgba(15,15,18,0.96) 100%);
		background: linear-gradient(to bottom, rgba(15,15,18,0) 0%, rgba(15,15,18,0.88) 55%, rgba(15,15,18,0.96) 100%);
	}

	#info { position: absolute; left: 48px; right: 48px; bottom: 22px; }
	#brand { font-size: 13px; letter-spacing: 4px; color: #FF7A00; font-weight: bold; }
	#server { font-size: 18px; margin-top: 2px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#meta { font-size: 12px; color: #8C8C96; margin-top: 2px; letter-spacing: 1px; }

	#status { margin-top: 8px; font-size: 13px; color: #C8C8D0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 70px; }
	#pct { position: absolute; right: 0; bottom: 14px; font-size: 13px; color: #FF7A00; font-weight: bold; }

	#track { position: relative; margin-top: 8px; height: 4px; background: #16161A; overflow: hidden; }
	#fill {
		position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
		background: #FF7A00; box-shadow: 0 0 10px rgba(255,122,0,0.8);
		-webkit-transition: width 0.4s ease; transition: width 0.4s ease;
	}
	#track.idle #fill {
		width: 30%;
		-webkit-animation: idle 1.6s ease-in-out infinite; animation: idle 1.6s ease-in-out infinite;
	}
	@-webkit-keyframes idle { from { left: -30%; } to { left: 100%; } }
	@keyframes idle { from { left: -30%; } to { left: 100%; } }

	#hint { position: absolute; right: 48px; top: 28px; font-size: 12px; color: rgba(232,232,236,0.55); text-align: right; }
</style>
</head>
<body>
	<div class="slide" style="background-image: url('img/1.jpg');"></div>
	<div class="slide" style="background-image: url('img/2.jpg');"></div>
	<div class="slide" style="background-image: url('img/3.jpg');"></div>
	<div class="slide" style="background-image: url('img/4.jpg');"></div>

	<div id="shade"></div>
	<div id="hint">Первый вход дольше обычного — контент скачивается один раз</div>

	<div id="info">
		<div id="brand">ЗАГРУЗКА</div>
		<div id="server">MAGIC REPUBLIC | Clone Wars RP</div>
		<div id="meta"></div>
		<div id="status">Подключение к серверу…</div>
		<div id="pct"></div>
		<div id="track" class="idle"><div id="fill"></div></div>
	</div>

<script>
	var slides = document.getElementsByClassName("slide");
	var current = 0;

	function show(i) {
		for (var k = 0; k < slides.length; k++) {
			slides[k].className = (k === i) ? "slide on" : "slide";
		}
	}

	show(0);
	setInterval(function () {
		current = (current + 1) % slides.length;
		show(current);
	}, 7000);

	var total = 0;
	var needed = 0;

	function el(id) { return document.getElementById(id); }

	function updateProgress() {
		if (total <= 0) {
			el("track").className = "idle";
			el("pct").innerHTML = "";
			return;
		}

		var done = Math.max(0, total - needed);
		var pct = Math.min(100, Math.floor(done / total * 100));

		el("track").className = "";
		el("fill").style.width = pct + "%";
		el("pct").innerHTML = pct + "%";
	}

	function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
		if (servername) { el("server").innerHTML = servername; }
		var parts = [];
		if (mapname) { parts.push(mapname); }
		if (maxplayers) { parts.push("до " + maxplayers + " игроков"); }
		el("meta").innerHTML = parts.join("  ·  ");
	}

	function SetFilesTotal(n) { total = n; updateProgress(); }
	function SetFilesNeeded(n) { needed = n; updateProgress(); }

	function DownloadingFile(fileName) {
		var name = String(fileName || "").split("/").pop();
		el("status").innerHTML = "Скачивание: " + name;
	}

	function SetStatusChanged(status) {
		var s = String(status || "");
		var map = [
			["Workshop Complete", "Workshop-контент готов"],
			["Sending client info", "Отправка данных клиента"],
			["Client info sent", "Данные клиента отправлены"],
			["Requesting Lua", "Загрузка скриптов сервера"],
			["Mounting Addons", "Подключение аддонов"],
			["Starting Lua", "Запуск скриптов"],
			["Retrieving server info", "Получение информации о сервере"],
			["Loading", "Загрузка"]
		];
		for (var i = 0; i < map.length; i++) {
			if (s.indexOf(map[i][0]) === 0) { s = map[i][1] + s.substring(map[i][0].length); break; }
		}
		el("status").innerHTML = s;
	}
</script>
</body>
</html>
