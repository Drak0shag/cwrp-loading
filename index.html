<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MAGIC REPUBLIC</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080c; }

	.slide {
		position: absolute; left: 0; top: 0; width: 100%; height: 100%;
		opacity: 0;
		-webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease;
		pointer-events: none;
		z-index: 0;
	}
	.slide.on {
		opacity: 1;
		z-index: 1;
	}

	.scene {
		position: absolute; left: 0; top: 0; right: 0; bottom: 0;
		background-color: #05080c;
		background-position: center; background-size: cover; background-repeat: no-repeat;
	}
</style>
</head>
<body>
	<!-- Figma 1677:109 1:1 · lore title+body · без плашки загрузки/progress -->
	<div class="slide" data-src="img/1.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/2.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/3.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/4.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/5.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/6.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/7.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/8.jpg?v=1677hq4"><div class="scene"></div></div>
	<div class="slide" data-src="img/9.jpg?v=1677hq4"><div class="scene"></div></div>

<script>
	/* GMod loadingurl: setInterval часто спит — крутим из колбэков движка. */
	var slides = document.getElementsByClassName("slide");
	var current = 0;
	var SLIDE_MS = 6500;
	var lastSlideAt = 0;
	var loaded = {};

	function ensureBg(i) {
		var el = slides[i];
		if (!el || loaded[i]) return;
		var src = el.getAttribute("data-src");
		if (!src) return;
		var scene = el.getElementsByClassName("scene")[0];
		if (scene) scene.style.backgroundImage = "url('" + src + "')";
		loaded[i] = true;
		var n = (i + 1) % slides.length;
		if (!loaded[n]) {
			var img = new Image();
			img.onload = function () {
				var nel = slides[n];
				if (!nel || loaded[n]) return;
				var ns = nel.getElementsByClassName("scene")[0];
				if (ns) ns.style.backgroundImage = "url('" + nel.getAttribute("data-src") + "')";
				loaded[n] = true;
			};
			img.src = slides[n].getAttribute("data-src");
		}
	}

	function show(i) {
		ensureBg(i);
		for (var k = 0; k < slides.length; k++) {
			slides[k].className = (k === i) ? "slide on" : "slide";
		}
		current = i;
		lastSlideAt = +new Date();
	}

	function maybeAdvance(force) {
		var now = +new Date();
		if (!force && lastSlideAt && (now - lastSlideAt) < SLIDE_MS) return;
		show((current + 1) % slides.length);
	}

	show(0);
	setInterval(function () { maybeAdvance(false); }, 1000);

	window.GameDetails = function (servername) {
		if (servername) document.title = servername;
		maybeAdvance(false);
	};
	window.SetFilesTotal = function () { maybeAdvance(false); };
	window.SetFilesNeeded = function () { maybeAdvance(false); };
	window.DownloadingFile = function () { maybeAdvance(false); };
	window.SetStatusChanged = function () { maybeAdvance(false); };
</script>
</body>
</html>
